<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Azure Concord</title>
<meta name="description" content="The Azure Concord's character sheets, loot, shop, guild and journal for the Three Roads campaign.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IM+Fell+English+SC&family=Alegreya+Sans:ital,wght@0,400;0,500;0,700;1,400&family=IBM+Plex+Mono:wght@500;600&display=swap">
<style>
/* Layout: sticky header with tabs; a character picker until a player chooses; each tab is one column of panels that widens to grids on desktop */
:root{
  --bg:#ebe6d9;--surface:#f7f3e8;--surface2:#efe9da;--ink:#221f1a;--muted:#6a6356;--line:#d2c9b4;
  --accent:#8a6516;--accent-ink:#fff8e6;--good:#2e7a4e;--good-bg:#dcebdf;--bad:#a63e2e;--bad-bg:#f1dcd6;--info:#2d5d93;--info-bg:#dde6f1;
  --f-display:"IM Fell English SC","Palatino Linotype",Palatino,Georgia,serif;
  --f-body:"Alegreya Sans","Segoe UI",system-ui,sans-serif;
  --f-num:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root{
  --bg:#121418;--surface:#1b1e24;--surface2:#23272f;--ink:#e8dfc9;--muted:#9b947f;--line:#30353f;
  --accent:#d3ab50;--accent-ink:#1a1407;--good:#72c494;--good-bg:#1d3226;--bad:#e5806d;--bad-bg:#3a221e;--info:#8db3e6;--info-bg:#1d2a3b;color-scheme:dark}}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:16px/1.45 var(--f-body);padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--surface)}
.wrap{max-width:1120px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--surface);border-bottom:1px solid var(--line)}
header.top .wrap{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:8px 16px;padding-block:10px}
h1{font:400 1.6rem/1 var(--f-display);margin:0;letter-spacing:.02em}
h2{font:400 1.3rem var(--f-display);margin:0;text-wrap:balance}
h3{font:400 1.15rem var(--f-display);margin:0}
.sub{color:var(--muted);font-size:.88rem}
.lbl{font-size:.72rem;letter-spacing:.09em;text-transform:uppercase;color:var(--muted);font-weight:700}
.tabs{display:flex;flex-wrap:wrap;gap:4px;background:var(--surface2);padding:3px;border-radius:10px}
.tabs a{color:var(--muted);text-decoration:none;font-weight:500;padding:6px 12px;border-radius:8px}
.tabs a[aria-current="page"]{background:var(--ink);color:var(--bg)}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:5px 11px;cursor:pointer;font-weight:500}
.btn:hover{border-color:var(--accent)}
main{padding-block:16px 48px}
.stack{display:flex;flex-direction:column;gap:12px}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px}
.empty{color:var(--muted);font-style:italic}
.badge{font-size:.7rem;font-weight:700;letter-spacing:.05em;text-transform:uppercase;border:1px solid var(--line);border-radius:4px;padding:0 5px;color:var(--muted);white-space:nowrap}
.badge.warn{color:var(--bad);border-color:var(--bad)}
.rar{font-size:.8rem;color:var(--muted)}
.n{font-family:var(--f-num);font-variant-numeric:tabular-nums}
/* picker */
.pick{display:grid;gap:12px;grid-template-columns:repeat(auto-fill,minmax(220px,1fr))}
.tile{text-align:left;border:1px solid var(--line);border-radius:12px;background:var(--surface);padding:12px 14px;cursor:pointer;display:flex;flex-direction:column;gap:6px;color:inherit;min-width:0}
.tile:hover{border-color:var(--accent)}
.tile.dm{border:2px solid var(--ink)}
.btn.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.tile .nm{font:400 1.35rem var(--f-display)}
.tile .top{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.tile .ac{font:600 1.05rem var(--f-num);white-space:nowrap}
.tile ul{margin:0;padding-left:16px;font-size:.88rem}
/* sheet */
.sh-head{display:flex;flex-wrap:wrap;justify-content:space-between;gap:10px;align-items:end;border-bottom:2px solid var(--ink);padding-bottom:8px}
.big{font:400 2.2rem/1 var(--f-display);margin:0}
.strip{display:grid;grid-template-columns:repeat(auto-fit,minmax(96px,1fr));gap:8px}
.st{border:1px solid var(--line);border-radius:10px;background:var(--surface);padding:6px 10px;display:flex;flex-direction:column;min-width:0}
.st b{font:600 1.35rem/1.2 var(--f-num)}
.st small{color:var(--muted);font-size:.74rem;line-height:1.25}
.hpbar{height:6px;background:var(--surface2);border-radius:3px;overflow:hidden}
.hpbar span{display:block;height:100%;background:var(--good)}
.hpbar.low span{background:var(--bad)}
.abil{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:6px}
@media (max-width:440px){.abil{grid-template-columns:repeat(3,minmax(0,1fr))}}
.ab{text-align:center;border:1px solid var(--line);border-radius:10px;padding:6px 4px;background:var(--surface);display:flex;flex-direction:column}
.ab b{font:600 1.35rem/1.1 var(--f-num)}
.ab small{color:var(--muted);font:500 .8rem var(--f-num)}
.ab .sv{font-size:.78rem;border-top:1px dashed var(--line);margin-top:3px;padding-top:3px}
.alerts{display:grid;gap:14px;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));align-items:start}
.ag{display:flex;flex-direction:column;gap:6px}
.ag>.lbl{color:var(--tone)}
.al{border:1px solid var(--line);border-left:3px solid var(--tone);border-radius:8px;background:var(--surface);padding:7px 10px;display:flex;flex-direction:column;gap:2px}
.al .t{font-weight:700}
.al .s{font-size:.92rem}
.t-def{--tone:var(--bad)}.t-react{--tone:var(--info)}.t-save{--tone:var(--good)}.t-off{--tone:var(--accent)}.t-note{--tone:var(--muted)}.t-att{--tone:var(--bad)}
.gear{border:1px solid var(--line);border-radius:10px;background:var(--surface)}
.gr{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:2px 10px;padding:7px 10px;align-items:center}
.gr+.gr{border-top:1px solid var(--line)}
.gr .d{grid-column:1/-1;font-size:.86rem;color:var(--muted)}
.gr.off .n2{color:var(--muted)}
.pips{display:inline-flex;gap:3px;align-items:center;font:500 .8rem var(--f-num);color:var(--muted)}
.pip{width:9px;height:9px;border-radius:50%;border:1.5px solid var(--accent)}
.pip.on{background:var(--accent)}
.coins{display:flex;gap:12px;font:600 .9rem var(--f-num)}
.coins .gp{color:var(--accent)}
details>summary{cursor:pointer}
/* tables */
.tablewrap{overflow-x:auto}
table.ledger{width:100%;border-collapse:collapse;font-size:.95rem}
.ledger th{text-align:left;font-size:.72rem;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);padding:6px 8px;border-bottom:1px solid var(--line)}
.ledger td{padding:7px 8px;border-bottom:1px solid var(--line);vertical-align:top}
/* house */
.org-top{border:2px solid var(--ink);border-radius:12px;padding:10px 12px;display:flex;flex-direction:column;gap:6px;background:var(--surface)}
.pchip{border:1px solid var(--line);border-radius:999px;padding:3px 10px;font-size:.9rem;background:var(--bg)}
.pchip.wolf{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);font-weight:700}
.caps{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(200px,1fr))}
.pc{border:1px solid var(--line);border-radius:10px;background:var(--surface);padding:7px 10px;display:flex;flex-direction:column}
.pc b{overflow-wrap:anywhere}
.pc.cap{border-width:2px}
.subs{display:flex;flex-direction:column;gap:6px;border-left:2px solid var(--line);margin-left:10px;padding-left:10px}
.divn{font-size:.72rem;letter-spacing:.09em;text-transform:uppercase;font-weight:700;color:var(--accent)}
.ctrs{display:grid;gap:10px;grid-template-columns:repeat(auto-fill,minmax(280px,1fr))}
.ctr{border:1px solid var(--line);border-left:3px solid var(--accent);border-radius:10px;background:var(--surface);padding:10px 12px;display:flex;flex-direction:column;gap:6px}
/* journal */
.journal{display:grid;gap:16px;grid-template-columns:1fr}
@media (min-width:880px){.journal{grid-template-columns:240px minmax(0,1fr);align-items:start}}
.jrail{display:flex;flex-direction:column;gap:6px}
@media (max-width:879px){.jrail{flex-direction:row;overflow-x:auto}.jstep{min-width:200px}}
.jstep{display:grid;grid-template-columns:auto 1fr;gap:10px;align-items:center;text-align:left;border:1px solid var(--line);border-radius:10px;background:var(--surface);padding:8px 10px;cursor:pointer}
.jstep.on{border-color:var(--ink);box-shadow:0 0 0 1px var(--ink)}
.jstep small{color:var(--muted);font-size:.78rem;display:block}
.jn{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;background:var(--ink);color:var(--bg);font:600 .9rem var(--f-num)}
.jl{margin:0;padding-left:18px;display:flex;flex-direction:column;gap:4px}
.jgrid{display:grid;gap:16px;grid-template-columns:repeat(auto-fit,minmax(260px,1fr))}
.dec{border-left:3px solid var(--accent);padding:2px 0 2px 10px;display:flex;flex-direction:column}
.tl{list-style:none;margin:0;padding:0;border-left:2px solid var(--line);display:flex;flex-direction:column;gap:8px}
.tl li{display:grid;grid-template-columns:120px 1fr;gap:10px;padding-left:12px;position:relative}
.tl li::before{content:"";position:absolute;left:-6px;top:6px;width:10px;height:10px;border-radius:50%;background:var(--accent)}
@media (max-width:480px){.tl li{grid-template-columns:1fr;gap:2px}}
.tw{font:600 .82rem var(--f-num);color:var(--muted)}
a{color:var(--accent)}
.enc{display:grid;gap:16px;grid-template-columns:1fr}
@media (min-width:880px){.enc{grid-template-columns:minmax(0,5fr) minmax(0,6fr);align-items:start}}
.seg{display:flex;flex-wrap:wrap;border:1px solid var(--line);border-radius:9px;overflow:hidden;background:var(--surface)}
.seg button{border:0;background:none;padding:7px 12px;cursor:pointer;flex:1 0 auto;color:var(--muted);font-weight:500}
.seg button+button{border-left:1px solid var(--line)}
.seg button[aria-pressed="true"]{background:var(--surface2);color:var(--ink);box-shadow:inset 0 -2px 0 var(--accent)}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:4px 11px;cursor:pointer;font-size:.9rem}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.chk{display:inline-flex;gap:6px;align-items:center;cursor:pointer;font-size:.93rem}
.chk input{accent-color:var(--accent);width:16px;height:16px}
.field{display:flex;flex-direction:column;gap:4px}
select{font:inherit;color:inherit;background:var(--surface);border:1px solid var(--line);border-radius:7px;padding:6px 8px;max-width:16rem}
.verdict{border:1px solid var(--line);border-radius:12px;padding:12px 16px;background:var(--surface);display:flex;flex-direction:column}
.verdict b{font:400 1.5rem var(--f-display)}
.verdict.good{background:var(--good-bg);border-color:var(--good)}.verdict.good b{color:var(--good)}
.verdict.bad{background:var(--bad-bg);border-color:var(--bad)}.verdict.bad b{color:var(--bad)}
.why{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:3px;font-size:.93rem}
.why .up{color:var(--good)}.why .down{color:var(--bad)}
.alarm{border-left:3px solid var(--bad);background:var(--bad-bg);padding:8px 12px;border-radius:0 8px 8px 0;font-weight:500}
table.brk{width:100%;border-collapse:collapse;font-size:.9rem;margin-top:6px}
.brk td{padding:3px 4px;border-bottom:1px solid var(--line)}
.brk td.n{text-align:right}
.foot{color:var(--muted);font-size:.82rem;padding-block:24px}
input,textarea{font:inherit;color:inherit;background:var(--surface);border:1px solid var(--line);border-radius:7px;padding:6px 8px;min-width:0}
input[type=number]{width:8rem;font-family:var(--f-num)}
textarea{width:100%;resize:vertical}
.btn.sm{padding:2px 9px;font-size:.84rem}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn[disabled]{opacity:.45;cursor:default}
.acts{display:flex;flex-wrap:wrap;gap:6px;margin-top:4px}
.sendbox{display:flex;flex-wrap:wrap;gap:8px;align-items:end;margin-top:6px}
.warn{color:var(--bad)}
.dmbox{border:1px dashed #7b3b5c;border-radius:8px;padding:8px 10px;background:var(--surface)}
.dmbox>.lbl,.dmbox>summary{color:#7b3b5c}
@media (prefers-color-scheme:dark){.dmbox{border-color:#d08bb0}.dmbox>.lbl,.dmbox>summary{color:#d08bb0}}
.dmnote{color:#7b3b5c;font-style:italic}
@media (prefers-color-scheme:dark){.dmnote{color:#d08bb0}}
.tile.sel{border-color:var(--ink);box-shadow:0 0 0 1px var(--ink)}
.heat{display:grid;grid-template-columns:repeat(10,1fr);gap:3px}
.heat span{height:10px;border-radius:2px;background:var(--surface2);border:1px solid var(--line)}
.heat span.on{background:var(--bad);border-color:var(--bad)}
.bar5{display:inline-grid;grid-template-columns:repeat(5,10px);gap:2px;vertical-align:middle}
.bar5 span{height:9px;border-radius:2px;border:1px solid var(--line);background:var(--surface2)}
.bar5.good span.on{background:var(--good);border-color:var(--good)}.bar5.mid span.on{background:var(--accent);border-color:var(--accent)}.bar5.bad span.on{background:var(--bad);border-color:var(--bad)}
.meters{display:flex;flex-wrap:wrap;gap:4px 12px;font:600 .78rem var(--f-num);color:var(--muted);margin-top:4px}
.sees{font-size:.88rem;margin-top:4px}
.midrow{display:flex;flex-wrap:wrap;gap:10px;justify-content:center}.midrow .pc{max-width:360px}
.slide{position:relative;height:12px;border-radius:6px;background:linear-gradient(90deg,var(--bad),var(--accent) 50%,var(--good));margin:6px 6px 0}
.slide span{position:absolute;top:-5px;width:6px;height:22px;margin-left:-3px;border-radius:3px;background:var(--ink);box-shadow:0 0 0 2px var(--bg)}
.nlog{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
.nlog li{border-left:3px solid var(--accent);background:var(--surface);border-radius:0 8px 8px 0;padding:6px 10px}
.paper{margin-top:8px;padding:14px 16px;border:1px solid var(--line);border-radius:6px;background:var(--bg);font-family:var(--f-display);line-height:1.55;white-space:pre-wrap;max-width:62ch}
#toast{position:fixed;left:50%;bottom:calc(16px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:8px 14px;border-radius:8px;font-size:.92rem;z-index:20;max-width:calc(100% - 32px)}
#toast.bad{background:var(--bad);color:#fff}
.fgrid{display:grid;gap:8px;grid-template-columns:repeat(auto-fill,minmax(150px,1fr))}
.fgrid.six{grid-template-columns:repeat(6,minmax(0,1fr))}
@media (max-width:480px){.fgrid.six{grid-template-columns:repeat(3,minmax(0,1fr))}}
.fgrid input,.fgrid select{width:100%;max-width:none}
.dmbar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;border:1px dashed #7b3b5c;border-radius:8px;padding:6px 10px}
.dmbar>.lbl{color:#7b3b5c}
.btn.dmb{border-color:#7b3b5c;color:#7b3b5c}
@media (prefers-color-scheme:dark){.dmbar{border-color:#d08bb0}.dmbar>.lbl,.btn.dmb{color:#d08bb0;border-color:#d08bb0}}
.btn.danger{color:var(--bad);border-color:var(--bad)}
.okbox{border-left:3px solid var(--good);background:var(--good-bg);padding:8px 12px;border-radius:0 8px 8px 0}
.pctl{display:flex;flex-wrap:wrap;gap:8px;margin-top:6px}.pctl .tick{display:inline-flex;align-items:center;gap:4px}
/* D&D Beyond style sheet */
:root{--fig-skin:#e7dcc6;--fig-line:#8a7f6a}
@media (prefers-color-scheme:dark){:root{--fig-skin:#3a3f48;--fig-line:#7d8592}}
.sgrid{display:grid;gap:14px;grid-template-columns:1fr;align-items:start}
@media (min-width:760px){.sgrid{grid-template-columns:200px minmax(0,1fr)}.sgrid .tabsbox{grid-column:1/-1}}
@media (min-width:1080px){.sgrid{grid-template-columns:190px 230px minmax(0,1fr)}.sgrid .tabsbox{grid-column:auto}}
.abil2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:6px}
@media (max-width:759px){.abil2{grid-template-columns:repeat(6,minmax(0,1fr))}}
@media (max-width:440px){.abil2{grid-template-columns:repeat(3,minmax(0,1fr))}}
.pass{display:flex;flex-direction:column;gap:4px;padding:10px 12px}
.psv{display:flex;gap:8px;align-items:baseline}.psv b{min-width:2ch;font-size:1.1rem}
.skills{padding:10px 12px}
.sk{list-style:none;margin:6px 0 0;padding:0}
.sk li{display:grid;grid-template-columns:12px 2.6em minmax(0,1fr) auto;gap:6px;align-items:center;padding:3px 0;border-top:1px solid var(--line);font-size:.93rem}
.sk li:first-child{border-top:0}
.ska{font:600 .68rem var(--f-num);color:var(--muted)}
.dotp{width:10px;height:10px;border-radius:50%;border:1.5px solid var(--muted)}
.dotp.p1{background:var(--ink);border-color:var(--ink)}
.dotp.p2{background:var(--accent);border-color:var(--accent);box-shadow:0 0 0 2px var(--surface),0 0 0 3px var(--accent)}
.tabsbox{padding:0;overflow:hidden;min-width:0}
.stabs{display:flex;flex-wrap:wrap;border-bottom:1px solid var(--line);background:var(--surface2)}
.stabs button{border:0;background:none;padding:9px 12px;cursor:pointer;white-space:nowrap;color:var(--muted);font-weight:500}
.stabs button[aria-pressed="true"]{color:var(--ink);box-shadow:inset 0 -3px 0 var(--accent);background:var(--surface)}
.tbody{padding:14px;display:flex;flex-direction:column;gap:14px}
.tsec{display:flex;flex-direction:column;gap:6px}
.act{border:1px solid var(--line);border-left:3px solid var(--tone,var(--line));border-radius:8px;padding:7px 10px;display:flex;flex-direction:column;gap:2px;background:var(--surface)}
.act .s,p.s{font-size:.9rem;color:var(--muted)}
.spl{display:flex;flex-direction:column;gap:4px}
.sp{border:1px solid var(--line);border-radius:7px;padding:2px 8px;font-size:.88rem;display:inline-flex;gap:6px;align-items:baseline;background:var(--bg)}
.sp small{color:var(--muted);font:500 .72rem var(--f-num)}.sp i{font-style:normal;font:700 .7rem var(--f-num);color:var(--accent)}
table.atk tr.off td{color:var(--muted)}
.ledger td.n,.ledger th:nth-child(n+2){white-space:nowrap}
/* paper doll and inventory */
.doll{display:grid;gap:8px;grid-template-columns:minmax(0,1fr) 220px minmax(0,1fr);grid-template-areas:"head fig weap" "neck fig off" "cloak fig hands" "body fig rings" "legs fig waist" "feet fig .";align-items:stretch}
@media (max-width:640px){.doll{grid-template-columns:minmax(0,1fr) minmax(0,1fr);grid-template-areas:"fig fig" "head weap" "neck off" "cloak hands" "body rings" "legs waist" "feet ."}}
.fig{grid-area:fig;display:flex;justify-content:center;align-items:center;border-radius:12px;background:radial-gradient(circle at 50% 40%,var(--surface2),transparent 70%)}
.figsvg{width:100%;max-width:220px;height:auto;display:block}
@media (max-width:640px){.figsvg{max-width:170px}}
.figsvg .ov{transition:opacity .15s}.figsvg .ov:hover{opacity:.8}
.slot{border:1px dashed var(--line);border-radius:10px;padding:5px 8px;display:flex;flex-direction:column;gap:4px;min-width:0;background:var(--bg)}
.slot.filled{border-style:solid;background:var(--surface)}
.none{font-size:.82rem;color:var(--muted);font-style:italic;margin:0}
.ichip{border:1px solid var(--line);border-radius:7px;background:var(--surface2);padding:2px 7px;text-align:left;font-size:.88rem;cursor:grab;overflow-wrap:anywhere}
.ichip.picked{outline:2px solid var(--accent)}
[data-drop].over{outline:2px dashed var(--accent);outline-offset:2px;background:var(--surface2)}
.armed [data-drop],.armed[data-drop]{outline:1px dashed var(--accent);outline-offset:1px;cursor:pointer}
.invtree{display:flex;flex-direction:column;gap:10px}
.ivs{border:1px solid var(--line);border-radius:10px;background:var(--surface);padding:4px 0}
.ivh{display:flex;gap:8px;align-items:baseline;padding:4px 10px}

<body>
<div id="bgart" aria-hidden="true"></div>
<header class="top"><div class="wrap">
  <div><h1>Azure Concord</h1><div class="sub" id="who">Three Roads campaign</div></div>
  <nav class="tabs" id="tabs" aria-label="Sections"></nav>
</div></header>
<main class="wrap" id="app"><p class="empty">Opening the ledger…</p></main>
<div class="wrap foot" id="foot"></div>
<div id="toast" role="status" aria-live="polite" hidden></div>
<script>
(function(){
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const sgn=n=>(n>=0?'+':'')+n;
const fmt=n=>(+n||0).toLocaleString('en-US');
const ABIL=['str','dex','con','int','wis','cha'];
const TABS=[['sheet','Gear'],['party','Party'],['loot','Loot'],['shop','Shop'],['house','The House'],['journal','Journal'],['encounter','Encounter']];
let D=null,ME=null,JSEL=null,VIEW=null,PINERR='';
const first=s=>String(s||'').split(' ')[0];
const isOn=e=>e.active!==false&&(!e.attune||e.attuned);
const items=c=>(c.entries||[]).filter(e=>(e.kind||'item')==='item');
const notable=e=>(e.rarity&&!/^common$/i.test(e.rarity))||(e.fx||[]).length>0||!!e.attune||(+e.uses||0)>0;
const ATK={any:'',weapon:'weapon',melee:'melee',ranged:'ranged',spell:'spell'};
const ABL={any:'all',str:'STR',dex:'DEX',con:'CON',int:'INT',wis:'WIS',cha:'CHA',magic:'spell and magic','mental-magic':'INT, WIS and CHA saves vs magic'};
const TRIG={attacked:'when you’re targeted by an attack',hit:'when you’re hit',damaged:'when someone takes damage',save:'when a save is rolled',spell:'when you’re targeted by a spell',anyroll:'when a creature rolls to attack, check or damage',check:'on an ability check'};
const cap=s=>s?s[0].toUpperCase()+s.slice(1):s;
const dot=s=>s&&!/[.!?]$/.test(s)?s+'.':s;
function fxLine(f){const ak=ATK[f.a]||'';let s='';
  switch(f.w){
    case 'defense':s=f.t==='ac'?`${f.v} AC`:`${ak?cap(ak)+' attacks':'Attacks'} against you have ${f.t==='atkdis'?'disadvantage':'advantage'}`;break;
    case 'damage':{const d=f.d||'all damage';s=({resist:`Resistant to ${d}`,immune:`Immune to ${d} damage`,vuln:`Vulnerable to ${d}`,absorb:`Absorb ${d}: it heals you`,reduce:`Reduce ${d} damage by ${f.v}`,condimmune:`You can’t be ${d}`}[f.t]||'')+(f.a==='nonmagical'?' from nonmagical attacks':'');break}
    case 'save':{const ab=ABL[f.a]||f.a;s=({adv:`Advantage on ${ab} saves`,dis:`Disadvantage on ${ab} saves`,bonus:`${f.v} to ${ab} saves`,evasion:'Evasion: no damage on a successful DEX save, half on a failure',reroll:`Reroll a failed save${f.v?' ('+f.v+')':''}`}[f.t]||'');break}
    case 'aura':s=f.t==='savebonus'?`Allies within ${f.r||'?'} ft add ${f.v} to saves`:`Aura${f.r?' ('+f.r+' ft)':''}`;break;
    case 'reaction':s=`Reaction ${TRIG[f.a]||''}${f.s==='ally'?', protects allies'+(f.r?' within '+f.r+' ft':''):''}${f.v?': '+f.v:''}`;break;
    case 'offense':s=({adv:'You attack with advantage',dis:'You attack with disadvantage',hit:`${f.v} to hit`,dmg:`${f.v} ${f.d||''} damage`,crit:`You crit on ${f.v||'a 20'}`,rider:f.v||''}[f.t]||'')+(ak&&f.t!=='rider'?` (${ak})`:'');break;
  }
  return [dot(s.trim()),f.n].filter(Boolean).join(' ');
}
function itemLine(e){const f=(e.fx||[])[0];const t=f?fxLine(f):(e.desc||'');return t.length>110?t.slice(0,108)+'…':t}
function pips(e){const m=+e.uses||0;if(!m)return'';if(m>6)return`<span class="pips">${+e.left||0}/${m}</span>`;let s='';for(let i=0;i<m;i++)s+=`<span class="pip${i<(+e.left||0)?' on':''}"></span>`;return`<span class="pips" title="${+e.left||0} of ${m} left">${s}</span>`}
const me=()=>D&&(ME==='dm'?{id:'dm',name:'the DM'}:D.party.find(c=>c.id===ME));
const viewed=()=>D&&D.party.find(c=>c.id===(ME==='dm'?(VIEW||D.party[0].id):ME));

function tab(){const h=(location.hash||'').slice(1);return TABS.some(t=>t[0]===h)?h:'sheet'}
function gearLabel(){const c=viewed();if(!c)return'Gear';const n=first(c.name);return n+(/s$/i.test(n)?'’':'’s')+' Gear'}
function renderTabs(){$('#tabs').innerHTML=ME&&ME!=='pin'?TABS.map(([k,l])=>`<a href="#${k}"${tab()===k?' aria-current="page"':''}>${k==='sheet'?esc(gearLabel()):k==='encounter'?'Encounter<span class="beta">beta</span>':esc(l)}</a>`).join(''):'';
  const m=ME==='pin'?null:me();$('#who').innerHTML=m?`${ME==='dm'?'Viewing as':'Playing as'} <b>${esc(m.name)}</b> · <button class="btn" style="padding:1px 8px;font-size:.82rem" data-act="switch">Switch</button>`:'Three Roads campaign'}

/* ---------- class colors and page art ---------- */
const THEME={
  coach:{c:'monk',a:'#3a8bb5',l:'#d3ebf6',d:'#164e69'},
  cramaris:{c:'bard',a:'#6d42a8',l:'#e6dbf5',d:'#2f1754'},
  gogeezle:{c:'bard',a:'#a149b5',l:'#f2ddf6',d:'#4f1c60'},
  gorc:{c:'fighter',a:'#b3283b',l:'#f6d8db',d:'#560d19'},
  gror:{c:'fighter',a:'#b5492a',l:'#f6ddd1',d:'#58200e'},
  rina:{c:'artificer',a:'#5b6570',l:'#e2e6eb',d:'#1b2c66',sp:'#1f44b0'},
  slav:{c:'sorcerer',a:'#c18708',l:'#f8ecc4',d:'#634000'}};
const CLS_DEF={monk:{a:'#3a8bb5',l:'#d3ebf6',d:'#164e69'},bard:{a:'#7a45ad',l:'#e9dcf5',d:'#3a1a5e'},fighter:{a:'#b3283b',l:'#f6d8db',d:'#560d19'},sorcerer:{a:'#c18708',l:'#f8ecc4',d:'#634000'},artificer:{a:'#5b6570',l:'#e2e6eb',d:'#1b2c66',sp:'#1f44b0'}};
function themeOf(c){if(!c)return null;if(THEME[c.id])return THEME[c.id];const m=(c.cls||'').toLowerCase().match(/monk|bard|fighter|sorcerer|artificer/);return m?{c:m[0],...CLS_DEF[m[0]]}:null}
const thv=c=>{const t=themeOf(c);return t?`--ca:${t.a};--cl:${t.l};--cd:${t.d};--sp:${t.sp||t.d}`:''};
const PLAYERS={coach:'Evan',slav:'Marko',rina:'Tuba',gorc:'Devin',gror:'Bob',cramaris:'Drew',gogeezle:'Zac'};
const thc=c=>themeOf(c)?' th':'';
const tIco=c=>{const t=themeOf(c);return t?`<svg class="ico" viewBox="0 0 100 100" aria-hidden="true">${classIcon(t.c)}</svg>`:''};
/* deterministic scatter so the art doesn't jump between renders */
function rnd(seed){let s=seed>>>0||1;return()=>(s=(s*1664525+1013904223)>>>0)/4294967296}
function gearPath(cx,cy,r,n){const ri=r*.82,tw=Math.PI/n;let d='';for(let i=0;i<n;i++){const a=i*2*Math.PI/n;const pts=[[a-tw*.55,ri],[a-tw*.35,r],[a+tw*.35,r],[a+tw*.55,ri],[a+tw*1.45,ri]];pts.forEach(([t,rr],j)=>{d+=(i===0&&j===0?'M':'L')+(cx+rr*Math.cos(t)).toFixed(1)+' '+(cy+rr*Math.sin(t)).toFixed(1)+' '})}return d+'Z'}
const star4=(x,y,s)=>`M${x} ${y-s} Q${x+s*.18} ${y-s*.18} ${x+s} ${y} Q${x+s*.18} ${y+s*.18} ${x} ${y+s} Q${x-s*.18} ${y+s*.18} ${x-s} ${y} Q${x-s*.18} ${y-s*.18} ${x} ${y-s}Z`;
function classIcon(cls){/* small mark for cards, 0 0 100 100 */

function gearTab(c){const dm=dollMap(c),{m,where}=dm;const can=canHandle(c.id);const all=items(c);
  const chip=e=>`<button class="ichip${PICK&&PICK.e===e.id?' picked':''}"${can?` draggable="true" data-drag="${esc(e.id)}" data-h="${esc(c.id)}" `:''} data-act="show-item" data-e="${esc(e.id)}" title="${esc(e.name)}: tap to see it">${esc(e.name)}${e.attune&&!e.attuned?' <span class="badge warn">not attuned</span>':''}</button>`;
  const slotBox=([k,l])=>`<div class="slot${m[k].length?' filled':''}" style="grid-area:${k}" data-drop="slot:${k}" data-h="${esc(c.id)}"><span class="lbl">${l}</span>${m[k].length?m[k].map(chip).join(''):'<span class="none">empty</span>'}</div>`;

    const ask=(dmx(c.id).asks||{})[e.id];

      <summary${can?` draggable="true" data-drag="${esc(e.id)}" data-h="${esc(c.id)}"`:''}><span class="grip" aria-hidden="true">${can?'⠿':''}</span><span class="nm2"><b>${esc(e.name)}</b>${e.rarity?` <span class="rar">${esc(e.rarity)}</span>`:''}</span><span class="row" style="gap:5px">${b.join('')}${pips(e)}</span></summary>
      <div class="invb">${[e.rarity,e.attune?(e.attuned?'attuned':'requires attunement'):'',(+e.uses||0)>0?`${+e.left||0} of ${+e.uses} uses left${RESET_T[e.reset]?', back at '+RESET_T[e.reset]:''}`:''].filter(Boolean).length?`<p class="sub">${esc([e.rarity,e.attune?(e.attuned?'Attuned':'Requires attunement'):'',(+e.uses||0)>0?`${+e.left||0} of ${+e.uses} uses left${RESET_T[e.reset]?', back after a '+RESET_T[e.reset]:''}`:''].filter(Boolean).join(' · '))}</p>`:''}${e.desc?`<p>${esc(e.desc)}</p>`:''}${(e.fx||[]).length?`<ul class="jl">${e.fx.map(f=>`<li>${esc(fxLine(f))}</li>`).join('')}</ul>`:''}${ask?`<p class="dmnote">DM: ${esc(ask)}</p>`:''}${ME==='dm'?dmItemBtns(c.id,e):''}${itemActions(c.id,e,true)}</div>

function dropPlan(c,eid,zone){const e=items(c).find(x=>x.id===eid);if(!e)return {err:'That item isn’t here any more.'};
  if(zone==='auto'){const g=e.slot&&e.slot!=='pack'?e.slot:guessSlot(e);if(!g)return {err:`${e.name} doesn’t go in an equipment slot. Drop it on a slot box if you want it there anyway.`};zone='slot:'+g}
  const calls=[],P=(id,patch)=>calls.push({holder_id:c.id,entry_id:id,patch,actor:actor()});
  if(zone.startsWith('slot:')){const k=zone.slice(5);if(!CAP[k])return {err:'Unknown slot.'};const {m}=dollMap(c);const there=m[k].filter(x=>x.id!==eid);
    if(e.container)return {err:'Bags hang from your belt on their own. Drop things into the bag instead.'};
    if(there.length>=CAP[k]){if(CAP[k]>1)return {err:`${SLOT_L[k]} is full. Take something off first.`};
      const o=there[0];if(k==='weap'&&!m.off.length&&guessSlot(o)==='weap')P(o.id,{slot:'off',active:true});else P(o.id,{slot:'pack',active:false})}
    if(k==='off'&&m.off.length===0&&m.weap.some(x=>x.id===eid)){}
    P(eid,{slot:k,active:true,in:null});const two=k==='weap'&&/great|maul|halberd|glaive|pike|shortbow|longbow|two-handed/i.test(e.name)&&m.off.some(x=>x.id!==eid);return {calls,msg:`${e.name}: ${SLOT_L[k]}${e.attune&&!e.attuned?' (it needs attunement before it works)':''}${two?'. It takes two hands, so free your off hand':''}`}}
  if(zone==='pack'){P(eid,wearable(e)?{slot:'pack',active:false,in:null}:{in:null,active:true});return {calls,msg:`${e.name}: carried`}}
  if(zone.startsWith('in:')){const cid=zone.slice(3);if(cid===eid)return {err:'A bag can’t go inside itself.'};
    let p=items(c).find(x=>x.id===cid);while(p){if(p.id===eid)return {err:'That would put the bag inside itself.'};p=p.in?items(c).find(x=>x.id===p.in):null}
    if(e.in===cid)return {calls:[]};const bag=items(c).find(x=>x.id===cid);P(eid,{in:cid,active:false});return {calls,msg:`${e.name}: in the ${bag?bag.name:'bag'}`}}
  return {err:'You can’t put that there.'}}
async function doDrop(h,eid,zone){const c=h==='stash'?D.stash:D.party.find(x=>x.id===h);if(!c||!canHandle(h))return;PICK=null;
  const p=dropPlan(c,eid,zone);if(p.err){toast(p.err,true);render();return}if(!p.calls.length){render();return}
  if(BUSY)return;BUSY=true;document.body.classList.add('busy');
  try{for(const a of p.calls)await rpc('p_update_entry',a);await load();toast(p.msg);render()}
  catch(e){toast(e.message||'That didn’t save. Try again.',true)}finally{BUSY=false;document.body.classList.remove('busy')}}

async function api(path,opts={}){
  const r=await fetch(SB_URL+path,{...opts,headers:{apikey:SB_KEY,'Content-Type':'application/json',...(opts.headers||{})}});
  const t=await r.text();let j=null;try{j=t?JSON.parse(t):null}catch(e){}
  if(!r.ok)throw new Error((j&&(j.message||j.error_description||j.hint))||('The ledger answered with an error ('+r.status+').'));
  return j;
}
const rpc=(fn,args)=>api('/rest/v1/rpc/'+fn,{method:'POST',body:JSON.stringify(args)});

async function load(){
  const [docs,notes,act]=await Promise.all([

    api('/rest/v1/notes?select=id,session,author,body,created_at&order=created_at.asc'),
    api('/rest/v1/activity?select=actor,action,detail,created_at&order=id.desc&limit=40')]);
  const of=k=>docs.filter(d=>d.kind===k);
  const one=k=>(of(k)[0]||{}).data||{};
  const party=of('char').map(d=>({...d.data,id:d.id,ddb:DDB[d.id]})).sort((a,b)=>(a.order??99)-(b.order??99));
  const st=of('stash')[0];
  D={party,stash:st?{...st.data,id:st.id}:null,shop:one('shop'),house:one('house'),
    journal:{sessions:one('journal').sessions||[],notes:(notes||[]).map(n=>({id:n.id,session:n.session,by:n.author,text:n.body,at:n.created_at}))},
    activity:act||[],updated:docs.map(d=>d.updated_at).sort().pop()};
}

    <span class="coins"><span class="gp">${fmt(c.gold)} gp</span><span>${+c.jars||0} ash jars</span></span>
    ${nb.length?`<ul>${nb.map(e=>`<li><b>${esc(e.name)}</b>${e.container?` <span class="rar">holds ${items(c).filter(x=>x.in===e.id).length}</span>`:itemLine(e)?`<div class="rar">${esc(itemLine(e))}</div>`:''}</li>`).join('')}</ul>`:'<span class="empty">No magic or story items.</span>'}

const DAY=86400000;
function whenTxt(iso){if(!iso)return'';const d=new Date(iso);const days=(d-Date.now())/DAY;
  return d.toLocaleString(undefined,Math.abs(days)<6?{weekday:'short',hour:'numeric',minute:'2-digit'}:{month:'short',day:'numeric',hour:'numeric',minute:'2-digit'})}
function spanTxt(ms){const h=Math.round(Math.abs(ms)/3600000);return h<1?'less than an hour':h<36?h+' hour'+(h===1?'':'s'):Math.round(h/24)+' days'}
const runDC=(S,route)=>Math.max(1,Math.min(19,(+(S.base??2))+(+S.heat||0)-(route==='back'?2:0)));
const travel=S=>({main:1,back:2,shop:1,...(S.travel||{})});
/* where Wick is right now, worked out from the clock. The outcome stays hidden until he's back. */
function tripState(T){const now=Date.now(),l=+new Date(T.leftAt),a=+new Date(T.arriveAt),r=+new Date(T.returnAt);
  const leg=a-l,shopEnd=r-leg,tot=Math.max(1,r-l);const f=Math.max(0,Math.min(1,(now-l)/tot));
  let phase,txt;
  if(T.phase==='missing'){phase='missing';txt='He hasn’t come back. Nobody has heard from him.'}
  else if(now<a){phase='out';txt=`On the road to the shop. He should get there ${whenTxt(T.arriveAt)}.`}
  else if(now<shopEnd){phase='shop';txt=`At the shop with Steven, selling what he brought. He heads back ${whenTxt(new Date(shopEnd).toISOString())}.`}
  else if(now<r){phase='back';txt=`On his way back. Due ${whenTxt(T.returnAt)}.`}
  else if(now-r<6*3600000){phase='due';txt='He’s due back about now. No sign of him yet.'}
  else {phase='late';txt=`Overdue by ${spanTxt(now-r)}. No word yet.`}
  return {f:T.phase==='missing'?1:f,phase,txt,shopAt:leg/tot,shopEndAt:(shopEnd-l)/tot}}
function tracker(S){const T=S.trip;const st=tripState(T);const pct=v=>(v*100).toFixed(1)+'%';
  return `<div class="trk${st.phase==='late'||st.phase==='missing'?' warn':''}"><div class="trk-line"><span class="trk-done" style="width:${pct(st.f)}"></span>

      <span class="trk-node shopn" style="left:${pct(st.shopAt)}"><b>The shop</b><small>~${esc(whenTxt(T.arriveAt))}</small></span>
      <span class="trk-node n2" style="left:100%"><b>Back</b><small>~${esc(whenTxt(T.returnAt))}</small></span>

    <p class="trk-txt"><b>${esc(st.txt)}</b></p>
    <p class="sub" style="margin:0">${T.route==='back'?'Back roads':'Main road'} · run DC ${esc(T.dc)} · sent by ${esc(T.by==='dm'?'the DM':holderName(T.by))}${(T.items||[]).length?` · carrying ${esc(T.items.join(', '))}`:' · carrying nothing to sell'}</p></div>`}
function runPanel(S){const r=S.runner||{},tv=travel(S),pack=(S.cargo||[]).filter(x=>x.status==='pack');const can=!!ME&&ME!=='pin';

    <div class="routes">${opt('main')}${opt('back')}</div>
    ${can?(SCONF?`<div class="sendbox"><span>Send Wick by the <b>${SROUTE==='back'?'back roads':'main road'}</b> with ${pack.length?pack.length+' item'+(pack.length===1?'':'s'):'nothing to sell'}? ${S.inSession?'He’ll be back right away.':`He should be back about ${esc(whenTxt(eta))}.`} Once he leaves, nothing can be taken back.</span><button class="btn primary" data-act="s-go">Send him</button><button class="btn" data-act="s-cancel">Not yet</button></div>`:`<div class="row"><button class="btn primary" data-act="s-ask">Send Wick to the shop</button><span class="sub">Taking something back puts it in Party loot.</span></div>`):''}</section>`}

// Re-read the latest copy, apply one change, write it back. Keeps a player's edit made a moment ago.
async function rawPut(id,mutate,secret){
  let cur,kind;
  if(secret){const r=await rpc('dm_get',{pin:PIN});if(r&&r.error)throw new Error(r.error);cur=(r.docs||{})[id]||{}}
  else{const rows=await api('/rest/v1/docs?select=kind,data&id=eq.'+encodeURIComponent(id));if(!rows||!rows.length)throw new Error('Record not found: '+id);cur=rows[0].data;kind=rows[0].kind}
  const next=mutate(clone(cur));
  const r=await rpc('dm_put',{pin:PIN,doc_id:id,doc_kind:kind||'char',doc_data:next,secret:!!secret});
  if(r!=='Saved.')throw new Error(r||'Not saved.');
  return next;
}
async function dmDo(fn,msg){if(BUSY)return;BUSY=true;document.body.classList.add('busy');
  try{await fn();await load();const g=await rpc('dm_get',{pin:PIN});if(g&&!g.error)DMX=g.docs||{};toast(msg||'Saved');render()}
  catch(e){toast(e.message||'That didn’t save.',true)}finally{BUSY=false;document.body.classList.remove('busy')}}

function rollTxt(T){if(!T)return'';const parts=[`d20 <b>${T.d20}</b> vs DC ${(+T.thr||0)+1}: ${T.hit?'<b>trouble</b>':'<b>he makes it</b>'}`];
  if(T.hit)parts.push(`trouble d6 ${T.d6}: ${esc(T.trouble||'')}`);
  if(T.question)parts.push(T.held?`questioned: loyalty d6 ${T.loyRoll}, he keeps quiet`:`questioned: loyalty d6 ${T.loyRoll}, <b>he talks</b>. Slip d4 ${T.d4}: ${esc(T.spill||'')}`);
  if(T.rumor)parts.push(`rumor d6 ${T.r6}: ${esc(T.rumor)}`);
  const eff=[T.lostCargo?'loses the cargo':'',T.goldTaken?'loses the gold':'',T.late?'a day late':'',T.taken?'doesn’t come back':'',T.heat?'heat +'+T.heat:''].filter(Boolean);
  if(eff.length)parts.push('Result: '+eff.join(', '));return parts.join('<br>')}

    <div class="row" style="align-items:end"><span class="lbl">Travel days</span><label class="field"><span class="lbl">Main road, each way</span><input type="number" min="0" step="0.5" id="tv-main" value="${tv.main}" style="width:6em"></label><label class="field"><span class="lbl">Back roads, each way</span><input type="number" min="0" step="0.5" id="tv-back" value="${tv.back}" style="width:6em"></label><label class="field"><span class="lbl">At the shop</span><input type="number" min="0" step="0.5" id="tv-shop" value="${tv.shop}" style="width:6em"></label><button class="btn" data-act="dm-travel">Save</button></div>

    ${(X.upgrades||[]).length?`<div class="panel stack" style="gap:6px"><span class="lbl">Upgrades (players see active and being built)</span>${X.upgrades.map((u,i)=>`<div class="row"><b style="flex:1">${esc(u.name)}</b><select data-dmchg="upg" data-i="${i}" aria-label="${esc(u.name)} status">${optsH([['active','Active'],['building','Being built'],['planned','Planned'],['notfound','Not found yet'],['locked','Locked'],['lost','Lost']],u.status)}</select></div>`).join('')}</div>`:''}

/* journal */
const JLIST=[['highlights','Highlights','One per line'],['people','People they met','Name — who they are'],['loot','Loot','Item — who has it'],['decisions','Decisions','What they chose — what came of it'],['events','Timeline','When | what happened'],['threads','Still open','One per line']];
const SEP=' — ';
const toLines=(k,arr)=>(arr||[]).map(x=>k==='people'?x.name+(x.note?SEP+x.note:''):k==='loot'?x.item+(x.who?SEP+x.who:''):k==='decisions'?x.choice+(x.result?SEP+x.result:''):k==='events'?(x.when||'')+' | '+x.text:x).join('\n');
function fromLines(k,t){const L=String(t||'').split('\n').map(x=>x.trim()).filter(Boolean);const pr=(a,b)=>l=>{const i=l.indexOf(SEP);return i<0?{[a]:l,[b]:''}:{[a]:l.slice(0,i).trim(),[b]:l.slice(i+SEP.length).trim()}};
  if(k==='people')return L.map(pr('name','note'));if(k==='loot')return L.map(pr('item','who'));if(k==='decisions')return L.map(pr('choice','result'));
  if(k==='events')return L.map(l=>{const i=l.indexOf('|');return i<0?{when:'',text:l}:{when:l.slice(0,i).trim(),text:l.slice(i+1).trim()}});return L}
function dmJournalPanel(s,i){if(DMED!=='jr:'+i)return `<div class="dmbar"><span class="lbl">DM tools</span><button class="btn sm" data-act="dm-open" data-v="jr:${i}">Edit this session</button><button class="btn sm" data-act="dm-jadd">Add a new session</button></div>`;
  const X=dmx('journal');
  return `<section class="dmbox stack"><div class="row"><span class="lbl" style="flex:1">Editing session ${esc(s.num||i+1)}</span><button class="btn sm" data-act="dm-close">Cancel</button></div>
    <div class="fgrid"><label class="field"><span class="lbl">Title</span><input type="text" id="js-title" value="${esc(s.title||'')}"></label><label class="field"><span class="lbl">Played on</span><input type="text" id="js-played" value="${esc(s.played||'')}" placeholder="Nov 15, 2026"></label><label class="field"><span class="lbl">In the world</span><input type="text" id="js-world" value="${esc(s.world||'')}" placeholder="Late autumn, days 14–16"></label></div>
    <label class="field"><span class="lbl">Opening line</span><input type="text" id="js-quote" value="${esc(s.quote||'')}"></label>
    <label class="field"><span class="lbl">Summary</span><textarea id="js-summary" rows="4">${esc(s.summary||'')}</textarea></label>
    ${JLIST.map(([k,l,ph])=>`<label class="field"><span class="lbl">${l}</span><textarea id="js-${k}" rows="4" placeholder="${esc(ph)}">${esc(toLines(k,s[k]))}</textarea></label>`).join('')}
    <label class="field"><span class="lbl">DM-only note</span><textarea id="js-dm" rows="3">${esc((X.dm||{})[String(i)]||'')}</textarea></label>
    <div class="row" style="justify-content:flex-end"><button class="btn primary" data-act="dm-jsave" data-i="${i}">Save session</button></div></section>`}

function dmClick(a,b){
  const h=b.dataset.h,e=b.dataset.e,i=+b.dataset.i;
  switch(a){
    case 'dm-open':DMED=b.dataset.v;IEDIT=null;render();break;
    case 'dm-close':DMED=null;render();break;
    case 'dm-sheet-save':dmSheetSave(b.dataset.id);break;
    case 'dm-attune':dmDo(()=>patchEntry(h,e,x=>({...x,attuned:b.dataset.v==='1'})),b.dataset.v==='1'?'Attuned':'Unattuned');break;
    case 'dm-item-edit':IEDIT={h,e};IDEL=null;render();break;
    case 'dm-item-cancel':IEDIT=null;IDEL=null;render();break;
    case 'dm-item-askdel':IDEL=e;render();break;
    case 'dm-item-save':{const o=readItem('ie');const ask=val('ie-ask');dmDo(async()=>{await patchEntry(h,e,x=>({...x,...o}));if(ask!==((dmx(h).asks||{})[e]||''))await rawPut(h,d=>{d.asks=d.asks||{};if(ask)d.asks[e]=ask;else delete d.asks[e];return d},true);IEDIT=null},'Item saved');break}
    case 'dm-item-del':dmDo(async()=>{await rawPut(h,d=>{d.entries=(d.entries||[]).filter(x=>x.id!==e&&x.in!==e);return d});IEDIT=null;IDEL=null},'Deleted');break;
    case 'dm-add-save':{const o=readItem('na');dmDo(async()=>{await rawPut(h,d=>{d.entries=[...(d.entries||[]),{id:newId(),fx:[],...o}];return d});DMED=null},o.name+' added');break}
    case 'dm-shop-n':{const k=b.dataset.k,dl=+b.dataset.d;dmDo(()=>rawPut('shop',d=>{if(k==='heat')d.heat=Math.max(0,Math.min(10,(+d.heat||0)+dl));else{d.runner=d.runner||{};d.runner.loyalty=Math.max(0,Math.min(6,(+d.runner.loyalty||0)+dl))}return d}),k==='heat'?'Heat updated':'Loyalty updated');break}
    case 'dm-sess':{const on=b.dataset.v==='1';dmDo(async()=>{const r=await rpc('dm_shop_session',{pin:PIN,live:on});if(/wrong pin/i.test(r))throw new Error(r)},on?`Session started. ${fmt((D.shop||{}).upkeep||0)} gp upkeep paid from Party loot.`:'Session ended');break}
    case 'dm-now':dmDo(async()=>{const r=await rpc('dm_shop_now',{pin:PIN});if(/wrong pin/i.test(r))throw new Error(r)},'Wick is back');break;
    case 'dm-tcancel':dmDo(async()=>{const r=await rpc('dm_shop_cancel',{pin:PIN});if(/wrong pin/i.test(r))throw new Error(r)},'Run called off');break;
    case 'dm-found':{const note=val('dm-found')||'';dmDo(async()=>{const r=await rpc('dm_shop_found',{pin:PIN,note});if(/wrong pin/i.test(r))throw new Error(r)},'Wick is back');break}
    case 'dm-travel':{const tv={main:Math.max(0,+val('tv-main')||0),back:Math.max(0,+val('tv-back')||0),shop:Math.max(0,+val('tv-shop')||0)};dmDo(()=>rawPut('shop',d=>{d.travel=tv;return d}),'Travel days saved');break}
    case 'dm-pricing':PRICING=b.dataset.id;SELLING=null;render();break;
    case 'dm-price':{const id=b.dataset.id,raw=val('price-'+id);const v=raw===''?null:Math.max(0,Math.floor(+raw));dmDo(async()=>{await rawPut('shop',d=>{(d.cargo||[]).forEach(x=>{if(x.id===id)x.ask=v});return d});PRICING=null},v==null?'Price cleared':`Asking ${fmt(v)} gp`);break}
    case 'dm-sell':SELLING=b.dataset.id;render();break;
    case 'dm-sell-cancel':SELLING=null;PRICING=null;render();break;
    case 'dm-sold':{const id=b.dataset.id,v=num('sell-'+id)||0;let credit=0;dmDo(async()=>{await rawPut('shop',d=>{(d.cargo||[]).forEach(x=>{if(x.id===id&&x.status!=='sold'){x.status='sold';x.sold=v;x.soldAt=today();credit=v}});return d});if(credit)await stashGold(credit);SELLING=null},`Sold for ${fmt(v)} gp, added to the stash`);break}
    case 'dm-return':{const id=b.dataset.id;let item=null;dmDo(async()=>{await rawPut('shop',d=>{(d.cargo||[]).forEach(x=>{if(x.id===id&&x.status!=='returned'){item=x;x.status='returned'}});return d});
      if(item&&item.entry){const to=D.party.some(c=>c.id===item.fromId)||item.fromId==='stash'?item.fromId:'stash';await rawPut(to,d=>{d.entries=[...(d.entries||[]),item.entry,...(item.kids||[])];return d})}},'Returned');break}
    case 'dm-p':{const id=b.dataset.id,k=b.dataset.k,dl=+b.dataset.d;dmDo(()=>rawPut('house',d=>{d.people=(d.people||[]).map(p=>p.id===id?{...p,[k]:Math.max(0,Math.min(5,(+p[k]||0)+dl))}:p);d.log=[...(d.log||[]),{when:today(),text:`${(d.people.find(p=>p.id===id)||{}).name}: ${k} ${dl>0?'up':'down'}`}].slice(-60);return d}),'Updated');break}
    case 'dm-ctr-save':{const st=val('ct-status'),desk=val('ct-desk'),up=val('ct-update'),dn=val('ct-dm');const name=((D.house||{}).contracts||[])[i].name;
      dmDo(async()=>{await rawPut('house',d=>{d.contracts=(d.contracts||[]).map((c,j)=>j===i?{...c,status:st,desk,update:up}:c);return d});if(dn!==((dmx('house').contracts||{})[name]||''))await rawPut('house',d=>{d.contracts=d.contracts||{};d.contracts[name]=dn;return d},true);DMED=null},'Contract saved');break}
    case 'dm-ctr-add':{const name=(val('nc-name')||'').trim();if(!name)return toast('Give the contract a name.',true);dmDo(()=>rawPut('house',d=>{d.contracts=[...(d.contracts||[]),{name,status:'active',desk:val('nc-desk')||'',told:val('nc-told')||'',update:''}];return d}),'Contract added');break}
    case 'dm-standing':{const t=val('hs-note');dmDo(()=>rawPut('house',d=>{d.standingNote=t;return d}),'Saved');break}
    case 'dm-settle':{const n=+b.dataset.v;dmDo(async()=>{await stashGold(n);await rawPut('house',d=>{d.log=[...(d.log||[]),{when:today(),text:`Settled the books: ${n<0?'−':'+'}${fmt(Math.abs(n))} gp`}].slice(-60);return d})},`Stash ${n<0?'−':'+'}${fmt(Math.abs(n))} gp`);break}
    case 'dm-deliver':{const s=((dmx('house').policy||{}).story||[])[i];if(!s)return;dmDo(()=>rawPut('house',d=>{d.delivered=[...(d.delivered||[]).filter(x=>x.t!==s.t),{t:s.t,tie:s.tie||'',letter:s.letter||'',at:today()}];return d}),'Delivered to the party');break}
    case 'dm-undeliver':{const s=((dmx('house').policy||{}).story||[])[i];if(!s)return;dmDo(()=>rawPut('house',d=>{d.delivered=(d.delivered||[]).filter(x=>x.t!==s.t);return d}),'Taken back');break}
    case 'dm-jsave':{const o={title:val('js-title'),played:val('js-played'),world:val('js-world'),quote:val('js-quote'),summary:val('js-summary')};for(const [k] of JLIST)o[k]=fromLines(k,val('js-'+k));const dn=val('js-dm');
      dmDo(async()=>{await rawPut('journal',d=>{d.sessions=(d.sessions||[]).map((s,j)=>j===i?{...s,...o}:s);return d});if(dn!==((dmx('journal').dm||{})[String(i)]||''))await rawPut('journal',d=>{d.dm=d.dm||{};if(dn)d.dm[String(i)]=dn;else delete d.dm[String(i)];return d},true);DMED=null},'Session saved');break}
    case 'dm-jadd':{let n=0;dmDo(async()=>{await rawPut('journal',d=>{d.sessions=d.sessions||[];n=d.sessions.length;d.sessions.push({num:n+1,title:'Session '+(n+1),summary:'',highlights:[],people:[],loot:[],decisions:[],events:[],threads:[]});return d});JSEL=n;DMED='jr:'+n},'Session added');break}
  }
}
function dmChange(el){const k=el.dataset.dmchg;

}

const YOU_C=[['prone','Prone'],['restrained','Restrained'],['blinded','Blinded'],['poisoned','Poisoned'],['frightened','Frightened'],['invisible','Invisible'],['dodging','Dodging'],['incap','Stunned, paralyzed or unconscious']];
const TGT_C=[['prone','Prone'],['restrained','Restrained'],['blinded','Blinded'],['incap','Stunned, paralyzed or unconscious'],['invisible','Invisible'],['dodging','Dodging']];
const isBandAC=(e,f)=>/gauntlet band/i.test(e.name)&&f.w==='defense'&&f.t==='ac';
function fxOf(c,pred){const o=[];for(const e of c.entries||[]){if(!isOn(e))continue;for(const f of e.fx||[])if(pred(f,e))o.push({f,e,c})}return o}
const mAtk=(a,k)=>!a||a==='any'||a===k||(a==='weapon'&&(k==='melee'||k==='ranged'));
const mSave=(a,ab,mg)=>!a||a==='any'||a===ab||(a==='magic'&&mg)||(a==='mental-magic'&&mg&&['int','wis','cha'].includes(ab));
function mDmg(f,t){if(f.a==='nonmagical'&&EQ.magic)return false;const d=String(f.d||'').toLowerCase();if(!d||d==='all')return true;return d.split(/[,\s]+/).includes(t)}
function encAnalyze(c){
  const R={adv:[],dis:[],nums:[],mine:[],allies:[],dmg:[],notes:[],alarms:[]};const Y=EQ.you,T=EQ.tgt,k=EQ.kind,close=EQ.close;
  const allyFx=pred=>{const o=[];for(const a of D.party){if(a.id===c.id)continue;for(const x of fxOf(a,pred))o.push(x)}return o};
  if(EQ.mode==='attacked'){
    if(Y.has('prone'))(close&&k==='melee'?R.adv:R.dis).push(close&&k==='melee'?'You’re prone and they’re within 5 ft':'You’re prone and they’re at range');
    if(Y.has('restrained'))R.adv.push('You’re restrained');
    if(Y.has('blinded'))R.adv.push('You’re blinded');
    if(Y.has('incap')){R.adv.push('You’re stunned, paralyzed or unconscious');if(close)R.alarms.push('A hit from within 5 ft is a critical hit while you’re paralyzed or unconscious.')}
    if(Y.has('invisible'))R.dis.push('You’re invisible');
    if(Y.has('dodging')&&!Y.has('incap'))R.dis.push('You took the Dodge action');
    for(const {f,e} of fxOf(c,f=>f.w==='defense'&&mAtk(f.a,k)&&f.t!=='ac'))(f.t==='atkdis'?R.dis:R.adv).push(e.name+(f.n?': '+f.n:''));
    const acb=fxOf(c,(f,e)=>f.w==='defense'&&f.t==='ac'&&mAtk(f.a,k)&&(!isBandAC(e,f)||EQ.seven));
    const base=+c.ac||0,tot=base+acb.reduce((s,x)=>s+(parseInt(x.f.v)||0),0);
    R.nums.push({label:'Your AC',val:tot,parts:[['Sheet AC',base],...acb.map(x=>[x.e.name,parseInt(x.f.v)||0])]});
    const trig=['attacked','hit','damaged','anyroll'].concat(k==='spell'?['spell']:[]);
    for(const x of fxOf(c,f=>f.w==='reaction'&&f.s!=='ally'&&trig.includes(f.a)))R.mine.push(x);
    for(const x of allyFx(f=>f.w==='reaction'&&f.s==='ally'&&trig.includes(f.a)))R.allies.push(x);
    for(const {f,e} of fxOf(c,f=>f.w==='damage')){if(f.t==='condimmune'){R.dmg.push(['Can’t be '+(f.d||''),e.name]);continue}if(!mDmg(f,EQ.dmg))continue;
      if(f.t==='reduce'&&!/bludg|pierc|slash/.test(EQ.dmg))continue;R.dmg.push([{resist:'Resistant: take half',immune:'Immune: take none',vuln:'Vulnerable: take double',absorb:'Absorb it: heal instead',reduce:'Reduce it by '+(f.v||'?')}[f.t]||f.t,e.name])}
  }else if(EQ.mode==='attacking'){
    const ranged=k==='ranged'||(k==='spell'&&!close);
    if(T.has('prone'))(close&&!ranged?R.adv:R.dis).push(close&&!ranged?'Target is prone and you’re within 5 ft':'Target is prone and you’re at range');
    if(T.has('restrained'))R.adv.push('Target is restrained');
    if(T.has('blinded'))R.adv.push('Target is blinded');
    if(T.has('incap')){R.adv.push('Target is stunned, paralyzed or unconscious');if(close)R.alarms.push('A hit from within 5 ft is a critical hit if the target is paralyzed or unconscious.')}
    if(T.has('invisible'))R.dis.push('Target is invisible');
    if(T.has('dodging')&&!T.has('incap'))R.dis.push('Target took the Dodge action');
    if(Y.has('blinded'))R.dis.push('You’re blinded');if(Y.has('poisoned'))R.dis.push('You’re poisoned');if(Y.has('frightened'))R.dis.push('You’re frightened and can see the source');if(Y.has('restrained'))R.dis.push('You’re restrained');if(Y.has('prone'))R.dis.push('You’re prone');if(Y.has('invisible'))R.adv.push('The target can’t see you');
    for(const {f,e} of fxOf(c,f=>f.w==='offense'&&(f.t==='adv'||f.t==='dis')&&mAtk(f.a,k)))(f.t==='adv'?R.adv:R.dis).push(e.name+(f.n?': '+f.n:''));
    if(c.toHit!=null){const hb=fxOf(c,f=>f.w==='offense'&&f.t==='hit'&&mAtk(f.a,k));R.nums.push({label:c.atkLabel||'To hit',val:'+'+(+c.toHit),parts:[['Sheet',+c.toHit],...hb.map(x=>[x.e.name,x.f.v])],note:c.atkNote})}
    for(const x of fxOf(c,f=>f.w==='offense'&&['rider','dmg','crit'].includes(f.t)&&mAtk(f.a,k)))R.mine.push(x);
  }else{
    const ab=EQ.ab;
    if(['str','dex'].includes(ab)&&Y.has('incap'))R.alarms.push('You automatically fail STR and DEX saves while stunned, paralyzed or unconscious.');
    if(ab==='dex'&&Y.has('restrained'))R.dis.push('You’re restrained');
    if(ab==='dex'&&Y.has('dodging')&&!Y.has('incap'))R.adv.push('You took the Dodge action');
    for(const {f,e} of fxOf(c,f=>f.w==='save'&&(f.t==='adv'||f.t==='dis')&&mSave(f.a,ab,EQ.magic)))(f.t==='adv'?R.adv:R.dis).push(e.name+(f.n?': '+f.n:''));
    const sb=fxOf(c,f=>f.w==='save'&&f.t==='bonus'&&mSave(f.a,ab,EQ.magic));
    const aur=[];for(const a of D.party)for(const x of fxOf(a,f=>f.w==='aura'&&f.t==='savebonus'))if(EQ.aura.has(a.id+'|'+x.e.id))aur.push(x);
    const base=+((c.saves||{})[ab]||0);const parts=[['Sheet '+ab.toUpperCase()+' save',base],...sb.map(x=>[x.e.name,x.f.v]),...aur.map(x=>[x.e.name+' ('+first(x.c.name)+')',x.f.v])];
    const tot=base+[...sb,...aur].reduce((s,x)=>s+(parseInt(x.f.v)||0),0);
    R.nums.push({label:ab.toUpperCase()+' save',val:sgn(tot),parts});
    if(ab==='dex')for(const {e} of fxOf(c,f=>f.w==='save'&&f.t==='evasion'))R.alarms.push(e.name+': on a DEX save for half damage, a success means no damage and a failure means half.');
    for(const x of fxOf(c,f=>(f.w==='save'&&f.t==='reroll')||(f.w==='reaction'&&f.s!=='ally'&&['save','damaged','anyroll'].concat(EQ.magic?['spell']:[]).includes(f.a))))R.mine.push(x);
    for(const x of allyFx(f=>f.w==='reaction'&&f.s==='ally'&&['save','damaged','anyroll'].includes(f.a)))R.allies.push(x);
    for(const {f,e} of fxOf(c,f=>f.w==='damage'&&f.t!=='condimmune'&&mDmg(f,EQ.dmg)))if(!(f.t==='reduce'&&!/bludg|pierc|slash/.test(EQ.dmg)))R.dmg.push([{resist:'Resistant: take half',immune:'Immune: take none',vuln:'Vulnerable: take double',absorb:'Absorb it: heal instead',reduce:'Reduce it by '+(f.v||'?')}[f.t]||f.t,e.name]);
    for(const {f,e} of fxOf(c,f=>f.w==='damage'&&f.t==='condimmune'))R.dmg.push(['Can’t be '+(f.d||''),e.name]);
  }
  {const g={};for(const x of R.allies){const k=x.e.name+'|'+(x.f.n||'')+'|'+(x.f.v||'');(g[k]=g[k]||{...x,who:[]}).who.push(first(x.c.name))}R.allies=Object.values(g);}
  if(EQ.seven)R.notes.push('All seven bands are within 60 ft: Unbroken Circle gives everyone +1 AC and advantage on death saves.');
  for(const {f,e} of fxOf(c,(f,en)=>f.w==='note'&&/gauntlet|band/i.test(en.name)===false&&/attack|save|hit|damage|reaction|bonus action|turn|0 hp|drop/i.test(f.n||'')))R.notes.push(e.name+': '+f.n);
  return R;
}
function encounter(c){
  const R=encAnalyze(c);const m=EQ.mode;
  let v='flat',big='Straight roll',sm='Roll 1d20';
  if(R.adv.length&&R.dis.length){sm='Advantage and disadvantage cancel out'}else if(R.adv.length){v=m==='attacked'?'bad':'good';big=m==='attacked'?'They roll with advantage':'Roll with advantage';sm='2d20, keep the higher'}else if(R.dis.length){v=m==='attacked'?'good':'bad';big=m==='attacked'?'They roll with disadvantage':'Roll with disadvantage';sm='2d20, keep the lower'}
  const seg=(k,opts,cur)=>`<div class="seg">${opts.map(([v2,l])=>`<button data-act="eq" data-k="${k}" data-v="${v2}" aria-pressed="${cur===v2}">${l}</button>`).join('')}</div>`;
  const chips=(k,list)=>`<div class="row" style="gap:6px">${list.map(([v2,l])=>`<button class="chip" data-act="eqset" data-k="${k}" data-v="${v2}" aria-pressed="${EQ[k].has(v2)}">${l}</button>`).join('')}</div>`;
  const auras=[];for(const a of D.party)for(const x of fxOf(a,f=>f.w==='aura'))auras.push({key:a.id+'|'+x.e.id,lab:`Within ${x.f.r||'?'} ft of ${first(a.name)} (${x.e.name})`});
  const card=(x,ally)=>`<div class="al t-${ally?'react':x.f.w==='offense'?'off':'react'}"><span class="t">${esc(x.e.name)} ${ally&&(x.who||[]).length>1?'':pips(x.e)}${ally?` <span class="rar">· ${esc((x.who||[first(x.c.name)]).join(', '))}${x.f.r?', within '+esc(x.f.r)+' ft':''}</span>`:''}</span><span class="s">${esc(fxLine(x.f))}</span></div>`;
  const reasons=[...R.adv.map(r=>`<li class="up">+ ${esc(r)}</li>`),...R.dis.map(r=>`<li class="down">− ${esc(r)}</li>`)].join('');
  return `<div class="enc">
    <section class="panel stack">
      <span class="lbl">What’s happening to ${esc(first(c.name))}</span>
      ${seg('mode',[['attacked','I’m being attacked'],['attacking','I’m attacking'],['save','I’m making a save']],m)}
      ${m==='save'?seg('ab',ABIL.map(a=>[a,a.toUpperCase()]),EQ.ab):seg('kind',[['melee','Melee'],['ranged','Ranged'],['spell','Spell attack']],EQ.kind)}
      <div class="row">${m!=='save'?`<label class="chk"><input type="checkbox" id="eq-close" data-eqc="close"${EQ.close?' checked':''}> Within 5 ft of each other</label>`:''}
        <label class="chk"><input type="checkbox" id="eq-magic" data-eqc="magic"${EQ.magic?' checked':''}> ${m==='save'?'It’s from a spell or magic':'The attack is magical'}</label>
        <label class="chk"><input type="checkbox" id="eq-seven" data-eqc="seven"${EQ.seven?' checked':''}> All seven bands within 60 ft</label></div>
      ${m!=='attacking'?`<label class="field"><span class="lbl">Damage type</span><select id="eq-dmg" data-eqs="dmg">${DMG.map(d=>`<option value="${d}"${d===EQ.dmg?' selected':''}>${cap(d)}</option>`).join('')}</select></label>`:''}
      ${auras.length&&m==='save'?`<div class="stack" style="gap:6px"><span class="lbl">Auras you’re standing in</span>${chips('aura',auras.map(a=>[a.key,a.lab]))}</div>`:''}
      <details${EQ.you.size||EQ.tgt.size?' open':''}><summary class="lbl">Conditions</summary><div class="stack" style="gap:8px;margin-top:8px"><span class="lbl">You are</span>${chips('you',YOU_C)}${m==='attacking'?`<span class="lbl">Your target is</span>${chips('tgt',TGT_C)}`:''}</div></details>
    </section>
    <section class="stack">
      <div class="verdict ${v}"><b>${big}</b><span class="sub">${sm}</span></div>
      ${reasons?`<ul class="why">${reasons}</ul>`:''}
      ${R.alarms.map(a=>`<div class="alarm">${esc(a)}</div>`).join('')}
      ${R.nums.map(n=>`<div class="panel"><div class="row"><span class="lbl" style="flex:1">${esc(n.label)}</span><b class="n" style="font-size:1.8rem">${esc(n.val)}</b></div><table class="brk">${n.parts.map(([a,b])=>`<tr><td>${esc(a)}</td><td class="n">${typeof b==='number'?(b>=0?'+':'')+b:esc(b)}</td></tr>`).join('')}</table>${n.note?`<p class="sub" style="margin:4px 0 0">${esc(n.note)}</p>`:''}</div>`).join('')}
      ${R.mine.length?`<div class="stack" style="gap:6px"><span class="lbl">${m==='attacking'?'When you hit':'You can use'}</span>${R.mine.map(x=>card(x)).join('')}</div>`:''}
      ${R.allies.length?`<div class="stack" style="gap:6px"><span class="lbl">Allies who can help, if they’re in range</span>${R.allies.map(x=>card(x,true)).join('')}</div>`:''}
      ${R.dmg.length?`<div class="stack" style="gap:6px"><span class="lbl">The damage you take</span>${R.dmg.map(([a,b])=>`<div class="al t-save"><span class="t">${esc(a)}</span><span class="s">${esc(b)}</span></div>`).join('')}</div>`:m!=='attacking'?`<p class="sub" style="margin:0">You take ${esc(EQ.dmg)} damage normally.</p>`:''}
      ${R.notes.length?`<div class="stack" style="gap:6px"><span class="lbl">Also remember</span><ul class="jl">${R.notes.map(n=>`<li>${esc(n)}</li>`).join('')}</ul></div>`:''}
    </section></div>`;
}

  else if(a==='addnote'){const t=$('#note-text');if(!t||!t.value.trim())return;const body=t.value.trim();(async()=>{try{await api('/rest/v1/notes',{method:'POST',headers:{Prefer:'return=minimal'},body:JSON.stringify({session:JSEL,author:ME,body})});await load();toast('Note added');render()}catch(e){toast(e.message,true)}})()}

  else if(a==='s-go'){SCONF=false;(async()=>{if(BUSY)return;BUSY=true;document.body.classList.add('busy');try{const r=await rpc('p_dispatch',{route:SROUTE,actor:actor()});await load();toast(r==='back'?'Wick ran the route. See how it went under Runs.':'Wick is on his way');render()}catch(e){toast(e.message||'That didn’t save. Try again.',true)}finally{BUSY=false;document.body.classList.remove('busy')}})()}
  else if(a==='s-unpack')act('p_unpack',{cargo_id:b.dataset.id,actor:actor()},'Taken back. It’s in Party loot.');
  else if(a==='show-item'){const d=document.querySelector(`details.inv[data-id="${CSS.escape(b.dataset.e)}"]`);if(d){d.open=true;d.scrollIntoView({behavior:'smooth',block:'center'});d.classList.add('flash');setTimeout(()=>d.classList.remove('flash'),1400)}}
  else if(a==='pick-item'){ev.preventDefault();PICK=PICK&&PICK.e===b.dataset.e?null:{h:b.dataset.h,e:b.dataset.e};render()}
  else if(a==='pick-cancel'){PICK=null;render()}
  else if(a==='drop')doDrop(b.dataset.h,b.dataset.e,b.dataset.z);
  else if(a==='view'){VIEW=b.dataset.id;PICK=null;DMED=null;IEDIT=null;render()}
  else if(a==='eq'){EQ[b.dataset.k]=b.dataset.v;if(b.dataset.k==='kind')EQ.close=b.dataset.v==='melee';render()}
  else if(a==='eqset'){const S=EQ[b.dataset.k];S.has(b.dataset.v)?S.delete(b.dataset.v):S.add(b.dataset.v);render()}

  const n=sig();if((force||n!==SIG||(tab()==='shop'&&D.shop&&D.shop.trip))&&quiet()){SIG=n;render()}}catch(e){}}
setInterval(()=>{if(document.visibilityState==='visible')refresh(false)},20000);
load().then(async()=>{$('#foot').textContent='Live from the party ledger. It refreshes on its own every few seconds.';const T=D.shop&&D.shop.trip;if(T&&T.phase==='out'&&Date.now()>=+new Date(T.returnAt)){LASTTICK=Date.now();try{await rpc('p_tick',{});await load()}catch(e){}}SIG=sig();render()})
  .catch(e=>{$('#app').innerHTML='<div class="panel"><h2>The ledger didn’t load</h2><p>'+esc(e.message)+'</p><p class="sub">Refresh the page. If the free database has paused after a quiet week, the DM can wake it from the Supabase dashboard.</p></div>'});
})();
</script>
